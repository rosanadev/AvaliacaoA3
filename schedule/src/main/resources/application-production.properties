spring.application.name=schedule

# Configurações do Railway (variáveis de ambiente)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/clinica_rosa_beauty}
spring.datasource.username=${MYSQLUSER:dev_clinica}
spring.datasource.password=${MYSQLPASSWORD:senha}

# Configurações de produção
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Configurações do servidor
server.port=${PORT:8080}
server.address=0.0.0.0

# Logging
logging.level.com.clinicaestetica=INFO
logging.level.org.springframework=WARN

# Actuator para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized