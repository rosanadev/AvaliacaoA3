name: Integration Tests

on:
  push:
    branches: [ master, grazidev, rosana, Evely, caio, vicc, frontend, testes ]
  pull_request:
    branches: [ master ]

jobs:
  unit-tests:
    name: Unit Tests (H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        working-directory: ./schedule
        run: mvn -B clean test -Dspring.profiles.active=test

      - name: Upload Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: schedule/target/surefire-reports/

  integration-tests:
    name: Integration Tests (MySQL)
    runs-on: ubuntu-latest
    needs: unit-tests  # Roda só se os unitários passarem

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: senha
          MYSQL_DATABASE: clinica_rosa_beauty_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Wait for MySQL to be ready
        run: |
          echo "Aguardando MySQL estar pronto..."
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P"3306" -u"root" -p"senha" --silent; then
              echo "✅ MySQL está pronto!"
              break
            fi
            echo "⏳ Tentativa $i/30: MySQL ainda não está pronto..."
            sleep 2
          done

      - name: Verify MySQL Connection
        run: |
          mysql -h 127.0.0.1 -P 3306 -u root -psenha -e "SHOW DATABASES;"
          mysql -h 127.0.0.1 -P 3306 -u root -psenha -e "SELECT VERSION();"

      - name: Run Integration Tests
        working-directory: ./schedule
        run: mvn -B verify -Dspring.profiles.active=ci -DskipUnitTests=true

      - name: Upload Integration Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: schedule/target/failsafe-reports/